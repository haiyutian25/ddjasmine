[workspace]
resolver = "2"
members = [
    "store",
    "session-log",
    "measure",
    "compose",
    "codec",
    "ffi",
    "uniffi-bindgen",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
sha2 = "0.10"
uniffi = "0.32"

[profile.release]
lto = true
codegen-units = 1
