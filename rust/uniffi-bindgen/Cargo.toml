[package]
name = "uniffi-bindgen"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Workspace-local uniffi-bindgen CLI, pinned to the workspace's uniffi version (no standalone CLI binary is published)"

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
